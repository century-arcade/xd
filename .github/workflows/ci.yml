name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install pytest -r requirements.txt
      - run: pytest

  analyze:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Compute weekly cache key
        id: week
        run: echo "key=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Restore gxd cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: gxd
          key: gxd-${{ steps.week.outputs.key }}
          restore-keys: |
            gxd-

      - name: Clone or update gxd
        # credential helper: keeps the token out of cached gxd/.git/config
        env:
          GXD_USER: ${{ secrets.GXD_DEPLOY_USER }}
          GXD_TOKEN: ${{ secrets.GXD_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GXD_TOKEN" ]; then
            git config --global credential.helper '!f() { echo "username=$GXD_USER"; echo "password=$GXD_TOKEN"; }; f'
            make setup-gxd
          elif [ -d gxd ]; then
            echo "::notice::no gxd deploy token (fork PR?); analyzing cached gxd as-is"
          else
            echo "::warning::no gxd deploy token and no cached gxd; skipping analyze"
            echo "SKIP_ANALYZE=1" >> "$GITHUB_ENV"
          fi

      - name: Install Python deps
        if: env.SKIP_ANALYZE != '1'
        run: pip install -r requirements.txt

      - name: Run make analyze
        if: env.SKIP_ANALYZE != '1'
        run: make analyze

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyze-output
          path: |
            wwwroot/xd-clues.zip
            wwwroot/xd-metadata.zip
          if-no-files-found: warn
          retention-days: 7
