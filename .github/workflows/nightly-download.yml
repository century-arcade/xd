name: Nightly download

# Downloads yesterday's puzzles from each configured publisher and uploads
# the raw source zip + import log as artifacts. Runs alongside the droplet's
# nightly cron — does not commit to gxd, does not update recent-downloads.tsv,
# does not push anywhere. Currently a comparison tool for verifying parity
# with the droplet's output before decommissioning it; longer-term plan is
# for this to become the authoritative job.

on:
  schedule:
    # 12:00 UTC daily. Because we fetch *yesterday's* puzzles, timing
    # relative to the droplet doesn't matter — by the time we run, all of
    # yesterday's content is settled regardless of when each publisher posted.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  download:
    if: github.repository == 'century-arcade/xd'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents:read overrides the workflow-level permission so it isn't
      # implicitly dropped by adding id-token below.
      contents: read
      # id-token:write is required for OIDC: GitHub mints a short-lived JWT
      # that aws-actions/configure-aws-credentials exchanges for temporary
      # AWS credentials. Scoped to this one job; other jobs (if added later)
      # would need to opt in explicitly.
      id-token: write
    env:
      # Mirrors the Makefile's `export PYTHONPATH=.` so the scripts can
      # find the in-repo xdfile/ package when invoked directly.
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system deps
        # libxml2/libxslt headers are needed by lxml when it falls back to a
        # source build on this runner image.
        run: sudo apt-get update -qq && sudo apt-get install -qq -y libxml2-dev libxslt1-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Partial+sparse clone of gxd
        # Avoids materializing the ~94k existing .xd files. cone-mode sparse
        # checks out only the root TSVs (publications.tsv, receipts.tsv, etc.)
        # which is all the downloader reads; new .xd files are written into
        # subdirs and picked up later via `git add --sparse`.
        run: |
          git clone --filter=blob:none --depth=1 --no-checkout https://gitlab.com/rabidrat/gxd.git gxd
          (cd gxd && git sparse-checkout init --cone && git checkout HEAD)

      - name: Download yesterday's puzzles
        # Range mode (--start/--end) bypasses the recent-downloads.tsv cursor
        # that download_today() consults. Without this the droplet's same-day
        # update would mark every pubid as already-fetched and we'd download
        # nothing. Range mode also intentionally does NOT write back to
        # recent-downloads.tsv, so this run leaves the droplet's cursor untouched.
        run: |
          yesterday=$(date -u -d 'yesterday' +%Y-%m-%d)
          WWWZIP="$GITHUB_WORKSPACE/$(date -u +%Y%m%d-%H%M%S)-www.zip"
          echo "WWWZIP=$WWWZIP" >> "$GITHUB_ENV"
          echo "Fetching puzzles for $yesterday"
          scripts/11-download-puzzles.py -o "$WWWZIP" --start "$yesterday" --end "$yesterday" 2>&1 | tee import.log

      - name: Convert downloads to .xd
        run: scripts/18-convert2xd.py -o gxd/ "$WWWZIP" 2>&1 | tee -a import.log

      - name: Summarize import
        run: |
          # Sanity check the downloader actually wrote something. Per-publication
          # errors are logged and swallowed inside 11-download-puzzles.py, so a
          # job where every source failed could otherwise reach here cleanly.
          if [ ! -s "$WWWZIP" ]; then
            echo "FAIL: no source zip produced by downloader" >&2
            exit 1
          fi
          cd gxd
          git add --sparse -A
          n_new_xd=$(git diff --cached --diff-filter=A --name-only | grep -c '\.xd$' || true)
          n_mod_xd=$(git diff --cached --diff-filter=M --name-only | grep -c '\.xd$' || true)
          echo "=== import summary ==="
          echo "new .xd files:      $n_new_xd"
          echo "modified .xd files: $n_mod_xd"
          git diff --cached --diff-filter=AM --stat | tail -40

      - name: Configure AWS credentials (OIDC)
        # Skip cleanly when AWS_S3_BUCKET is unset (forks, debugging branches).
        # always() so we still try to archive logs from a failed run.
        if: ${{ always() && vars.AWS_S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_S3_REGION }}

      - name: Upload source zip to S3
        # The log is already inside the zip (OutputZipFile writes a .log entry
        # on close), so we don't upload it separately.
        if: ${{ always() && vars.AWS_S3_BUCKET != '' }}
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          # WWWZIP is set by the download step; on early failures it may be empty.
          if [ -z "$WWWZIP" ]; then
            echo "WWWZIP not set — nothing to upload"
            exit 0
          fi
          if [ ! -f "$WWWZIP" ]; then
            echo "no source zip on disk; skipping upload"
            exit 0
          fi
          year=$(date -u +%Y)
          aws s3 cp "$WWWZIP" "${BUCKET}/${year}/$(basename "$WWWZIP")"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ github.run_id }}
          path: |
            *-www.zip
            import.log
          if-no-files-found: warn
          retention-days: 30
